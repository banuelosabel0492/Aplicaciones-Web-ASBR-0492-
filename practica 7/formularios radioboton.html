<!DOCTYPE html>
<html lang="en">
<head>
<!-- encabezado -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- titulo de la pagina-->
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<body>
<!-- cuerpo -->
<h2>Formularios con Radioboton</h2>
<!-- se define a donde se dirige la informacion y la envia-->
<form action="" method="post">
Ingresa tu nombre:
<!-- casilla de texto normal-->
<input type="text" name="nombre">
<!-- salto de linea-->
<br>
Selecciona el maximo de estudios que tienes:
<br>
<!-- botones circulares,solo se puede seleccionar una opcion-->
<input type="radio" name="estudios" value="1">Sin estudios <br>
<input type="radio" name="estudios" value="2">Primaria <br>
<input type="radio" name="estudios" value="3">Secundaria <br>
<input type="radio" name="estudios" value="4">Preparatoria <br>
<!--boton de enviar -->
<input type="submit" value="enviar">
<!--boton de borrar -->
<input type="reset" value="borrar">
</form>
</body>
</html>

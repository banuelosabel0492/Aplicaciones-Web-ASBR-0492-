<!DOCTYPE html>
<html lang="en">
<!-- encabezado -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- titulo de la pagina-->
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!-- cuerpo-->
<body>
<h2>Formulario para contraseñas</h2>
<!-- se define a donde se dirige la informacion y la envia-->

<form action="" method="post">

Ingresa tu usuario:
<!-- casilla de texto normal-->
<input type="text" name="usuario">
Ingresa tu contraseña:
<!-- campo para contraseñas,oculta el texto-->
<input type="password" name="pass">
<br>
<!-- boton de enviar-->
<input type="submit" value="enviar">
<!-- boton de borrar-->
<input type="reset" value="borrar">
</form>
</body>
</html>

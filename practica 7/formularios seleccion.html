<!DOCTYPE html>
<html lang="en">
<!-- encabezado -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- titulo de la pagina-->
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!-- cuerpo -->
<body>
<h2>Formularios con seleccion</h2>
<!-- se define a donde se dirige la informacion y la envia-->
<form action="" method="post">
Ingresa tu nombre:
<!-- casilla de texto normal-->
<input type="text" name="nombre">

<br>
Selecciona tu pais:
<!-- crea una lista de opciones -->
<select name="pais">
<!-- las opciones seleccionables -->
<option value="1">Argentina</option>
<option value="2">España</option>
<option value="3">Mexico</option>
<option value="4">Guatemala</option>
<option value="5">Honduras</option>
<option value="6">El Salvador</option>
<option value="7">Venezuela</option>
<option value="8">Colombia</option>
</select>
<!-- salto de linea-->
<br>
<!-- boton de enviar-->
<input type="submit" value="enviar">
<!-- boton de borrar-->
<input type="reset" value="borrar">
</form>
</body>
</html>

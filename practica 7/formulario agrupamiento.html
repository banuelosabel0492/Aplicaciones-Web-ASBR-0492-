<!DOCTYPE html>
<html lang="en">
<!--encabezado -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--titulo de la pagina -->
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!--cuerpo -->
<body>
<h2>Formularios con agrupamiento</h2>
<!-- se define a donde se dirige la informacion y la envia-->
<form action="" method="post">
<!--agrupa campos que estan relacionados entre si en un recuadro -->
<fieldset>
<!--define el titulo -->
<legend>Datos personales</legend>
Nombre y apellido:
<!-- casilla de texto normal-->
<input type="text" name="nombre_apellido"><br>
Documento valido:
<!--permite adjuntar archivos -->
<input type="file" name="documento"><br>
Fecha de nacimiento:
<!--muestra una seleccion de fecha -->
<input type="date" name="fecha_nacimiento">
</fieldset>
<!--agrupa campos que estan relacionados entre si en un recuadro -->
<fieldset>
<!--define el titulo -->
<legend>Datos de estudio:</legend>
Nombre de la escuela:
<!-- casilla de texto normal-->
<input type="text" name="escuela"><br>
Certificado valido:
<!--permite adjuntar archivos -->
<input type="file" name="certificado"><br>
Fecha de egreso:
<!--muestra una seleccion de fecha -->
<input type="date" name="fecha_egreso">
</fieldset>
<br>
<!-- boton de enviar,se agregan iconos visuales-->
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i> </button>
<!-- boton de borrar,se agregan iconos visuales-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button>
</form>
</body>
</html>

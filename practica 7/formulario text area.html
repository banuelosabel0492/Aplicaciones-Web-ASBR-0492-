<!DOCTYPE html>
<html lang="en">
<!-- encabezado -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- titulo de la pagina-->
<title>Formularios en HTML</title>
<!-- Libreria de iconos en linea -->

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-
awesome/7.3.1/css/all.min.css">

</head>
<!-- cuerpo-->
<body>
<h2>Formulario con text area</h2>
<!-- se define a donde se dirige la informacion y la envia-->
<form action="" method="post">
Ingresa tu nombre:
<!-- casilla de texto normal-->
<input type="text" name="nombre">
<br>
Ingresa tu correo:
<!-- campo para direcciones de correo electronico-->
<input type="email" name="correo">
<br>
Ingresa tus comentarios:
<!-- campo multilinea,se seleccionan filas y columnas-->
<textarea name="comentarios" rows="1" cols="10"></textarea>
<br>
<!-- boton de enviar-->
<input type="submit" value="enviar">
<!-- boton de borrar-->
<input type="reset" value="borrar">
</form>
</body>
</html>
